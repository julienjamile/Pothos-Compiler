<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pothos Lexer – Pothos Compiler</title>
    <meta name="description" content="Pothos lexical analyzer: paste Pothos source code and inspect tokens, lexical errors, and TD state paths interactively.">
  <script type="module" crossorigin src="./assets/index-Dv5OHjeO.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BTfeosE8.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="logo-wrapper">
                <img id="themeLogo" src="./assets/logo_dark-DeIAgQ13.png" alt="Pothos Lexer" height="64">
                <h1> Pothos Lexer</h1>
            </div>
            <div class="buttonTray">
                <label class="option-label" title="Remove comment tokens from the output">
                    <input type="checkbox" id="skipCommentsChk"> Hide comments
                </label>
                <label class="option-label" title="Show the TD state path for each token">
                    <input type="checkbox" id="traceChk"> Show TD states
                </label>
                <button class="run" id="runBtn">
                    <span class="material-icons">
                        play_arrow
                    </span>
                    <span class="btnLabel">Run</span>
                </button>
                <button class="theme" id="themeBtn">
                    <span class="material-icons">
                        dark_mode
                    </span>
                </button>
            </div>
        </div>
    </header>
    <div class="container-folder">
        <div class="container mobile-fold">
            <div class="card" id="codebox">
                <div id="editor" aria-label="Source code editor"></div>
            </div>
            <div class="right-bottom">
                <div class="card" id="lexerbox" autocorrect="off">
                    <table>
                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>Lexeme</th>
                                <th>Token</th>
                                <th>Line</th>
                                <th>Col</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="5">No Data</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card" id="errorBox">
                    <code>No errors found.</code>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
